<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Private Vault Modal</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
        <style>
            /* ── Reset ── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            /* ── Tokens ── */
            :root {
                --radius-sm: 8px;
                --radius-md: 12px;
                --radius-lg: 18px;
                --radius-xl: 24px;
                --font: "Inter", system-ui, sans-serif;

                /* Light palette */
                --bg-page: #f0f2f5;
                --bg-modal: #ffffff;
                --bg-input: #f5f6f8;
                --bg-icon-wrap: #eceef2;
                --bg-btn-ghost: #f0f2f5;
                --bg-btn-ghost-h: #e4e7ec;

                --text-primary: #0f1117;
                --text-secondary: #6b7280;
                --text-hint: #9ca3af;
                --text-on-blue: #ffffff;
                --text-danger: #b91c1c;

                --border-subtle: rgba(0, 0, 0, 0.08);
                --border-input: rgba(0, 0, 0, 0.1);
                --border-focus: #2563eb;

                --blue-btn: #2563eb;
                --blue-btn-h: #1d4ed8;

                --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
                --shadow-input: 0 0 0 3px rgba(37, 99, 235, 0.15);
            }

            [data-theme="dark"] {
                --bg-page: #0c0e13;
                --bg-modal: #161a23;
                --bg-input: #1e2230;
                --bg-icon-wrap: #252b3a;
                --bg-btn-ghost: #1e2230;
                --bg-btn-ghost-h: #252b3a;

                --text-primary: #f1f3f7;
                --text-secondary: #8b95a8;
                --text-hint: #525c6e;
                --text-on-blue: #ffffff;
                --text-danger: #f87171;

                --border-subtle: rgba(255, 255, 255, 0.07);
                --border-input: rgba(255, 255, 255, 0.09);
                --border-focus: #3b82f6;

                --blue-btn: #2563eb;
                --blue-btn-h: #3b82f6;

                --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.5), 0 4px 20px rgba(0, 0, 0, 0.3);
                --shadow-input: 0 0 0 3px rgba(59, 130, 246, 0.2);
            }

            /* ── Page shell ── */
            body {
                font-family: var(--font);
                background: var(--bg-page);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 32px;
                padding: 40px 16px;
                transition: background 0.25s ease;
            }

            /* ── Theme toggle ── */
            .theme-toggle {
                position: fixed;
                top: 20px;
                right: 20px;
                display: flex;
                align-items: center;
                gap: 8px;
                background: var(--bg-modal);
                border: 1px solid var(--border-subtle);
                border-radius: 999px;
                padding: 6px 14px 6px 10px;
                cursor: pointer;
                font-family: var(--font);
                font-size: 13px;
                font-weight: 500;
                color: var(--text-secondary);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                transition: all 0.2s ease;
                user-select: none;
                z-index: 100;
            }
            .theme-toggle:hover {
                color: var(--text-primary);
            }

            .toggle-track {
                width: 36px;
                height: 20px;
                border-radius: 999px;
                background: var(--border-input);
                position: relative;
                transition: background 0.2s ease;
            }
            [data-theme="dark"] .toggle-track {
                background: var(--blue-btn);
            }

            .toggle-thumb {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #fff;
                position: absolute;
                top: 3px;
                left: 3px;
                transition: transform 0.2s ease;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            }
            [data-theme="dark"] .toggle-thumb {
                transform: translateX(16px);
            }

            /* ── Label above modal ── */
            .mode-label {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--text-hint);
                text-align: center;
            }

            /* ── Modal card ── */
            .modal {
                width: 100%;
                max-width: 380px;
                background: var(--bg-modal);
                border-radius: var(--radius-xl);
                border: 1px solid var(--border-subtle);
                box-shadow: var(--shadow-modal);
                padding: 32px 28px 28px;
                display: flex;
                flex-direction: column;
                gap: 0;
                transition: background 0.25s ease, box-shadow 0.25s ease;
            }

            /* ── Header ── */
            .modal-header {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                margin-bottom: 28px;
            }

            .icon-wrap {
                width: 56px;
                height: 56px;
                border-radius: var(--radius-md);
                background: var(--bg-icon-wrap);
                border: 1px solid var(--border-subtle);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .icon-wrap svg {
                width: 24px;
                height: 24px;
                stroke: var(--text-secondary);
                fill: none;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .modal-title {
                font-size: 17px;
                font-weight: 600;
                color: var(--text-primary);
                text-align: center;
                line-height: 1.3;
            }

            .modal-subtitle {
                font-size: 13px;
                color: var(--text-secondary);
                text-align: center;
                margin-top: 4px;
                line-height: 1.5;
            }

            /* ── Form ── */
            .input-wrap {
                position: relative;
                margin-bottom: 10px;
            }

            .input-icon {
                position: absolute;
                left: 13px;
                top: 50%;
                transform: translateY(-50%);
                width: 16px;
                height: 16px;
                stroke: var(--text-hint);
                fill: none;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round;
                pointer-events: none;
            }

            .input-field {
                width: 100%;
                padding: 11px 14px 11px 40px;
                font-family: var(--font);
                font-size: 14px;
                color: var(--text-primary);
                background: var(--bg-input);
                border: 1px solid var(--border-input);
                border-radius: var(--radius-sm);
                outline: none;
                transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.25s ease;
            }

            .input-field::placeholder {
                color: var(--text-hint);
            }

            .input-field:focus {
                border-color: var(--border-focus);
                box-shadow: var(--shadow-input);
                background: var(--bg-modal);
            }

            /* ── Unlock button ── */
            .btn-primary {
                width: 100%;
                padding: 12px;
                font-family: var(--font);
                font-size: 14px;
                font-weight: 600;
                color: var(--text-on-blue);
                background: var(--blue-btn);
                border: none;
                border-radius: var(--radius-sm);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin-bottom: 10px;
                transition: background 0.18s ease, transform 0.1s ease;
                letter-spacing: 0.01em;
            }

            .btn-primary:hover {
                background: var(--blue-btn-h);
            }
            .btn-primary:active {
                transform: scale(0.985);
            }

            .btn-primary svg {
                width: 16px;
                height: 16px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            /* ── Secondary actions grid ── */
            .btn-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-bottom: 22px;
            }

            .btn-ghost {
                padding: 10px 8px;
                font-family: var(--font);
                font-size: 13px;
                font-weight: 500;
                color: var(--text-secondary);
                background: transparent;
                border: 1px solid var(--border-subtle);
                border-radius: var(--radius-sm);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                transition: background 0.15s ease, color 0.15s ease;
            }

            .btn-ghost:hover {
                background: var(--bg-btn-ghost-h);
                color: var(--text-primary);
            }

            .btn-ghost svg {
                width: 15px;
                height: 15px;
                stroke: currentColor;
                fill: none;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex-shrink: 0;
            }

            .btn-ghost.danger {
                color: var(--text-danger);
            }
            .btn-ghost.danger:hover {
                background: rgba(185, 28, 28, 0.06);
            }
            [data-theme="dark"] .btn-ghost.danger:hover {
                background: rgba(248, 113, 113, 0.08);
            }

            /* ── Footer trust line ── */
            .modal-footer {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                font-size: 12px;
                color: var(--text-hint);
            }

            .modal-footer svg {
                width: 13px;
                height: 13px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex-shrink: 0;
            }

            /* ── Divider ── */
            .divider {
                border: none;
                border-top: 1px solid var(--border-subtle);
                margin: 0 0 18px;
            }
        </style>
    </head>
    <body>
        <!-- Theme toggle -->
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
            <span id="toggle-label">Dark mode</span>
        </button>

        <!-- Light mode label -->
        <p class="mode-label" id="mode-label">Light mode</p>

        <!-- Modal -->
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vault-title">
            <div class="modal-header">
                <div class="icon-wrap" aria-hidden="true">
                    <!-- Lock icon -->
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </div>
                <div>
                    <h1 class="modal-title" id="vault-title">Private Vault</h1>
                    <p class="modal-subtitle">Enter your credentials to unlock</p>
                </div>
            </div>

            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"
                    />
                </svg>
                <input
                    type="password"
                    class="input-field"
                    id="pin-input"
                    placeholder="PIN or password"
                    autocomplete="current-password"
                    aria-label="PIN or password"
                />
            </div>

            <button class="btn-primary" onclick="handleUnlock(this)">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                </svg>
                Unlock vault
            </button>

            <div class="btn-grid">
                <button class="btn-ghost danger">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                    Reset PIN
                </button>
                <button class="btn-ghost">
                    <svg viewBox="0 0 24 24">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                        <line x1="12" y1="18" x2="12.01" y2="18" />
                    </svg>
                    Auth code
                </button>
            </div>

            <hr class="divider" />

            <div class="modal-footer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                <span>End-to-end encrypted</span>
            </div>
        </div>

        <script>
            function toggleTheme() {
                const html = document.documentElement;
                const isDark = html.getAttribute("data-theme") === "dark";
                html.setAttribute("data-theme", isDark ? "light" : "dark");
                document.getElementById("toggle-label").textContent = isDark ? "Dark mode" : "Light mode";
                document.getElementById("mode-label").textContent = isDark ? "Light mode" : "Dark mode";
            }

            function handleUnlock(btn) {
                const input = document.getElementById("pin-input");
                if (!input.value.trim()) {
                    input.style.borderColor = "var(--text-danger)";
                    input.focus();
                    setTimeout(() => {
                        input.style.borderColor = "";
                    }, 1500);
                    return;
                }
                btn.textContent = "Unlocking…";
                btn.disabled = true;
                setTimeout(() => {
                    btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg> Unlocked`;
                    btn.style.background = "#16a34a";
                }, 1200);
            }
        </script>
    </body>
</html>
