<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clipd</title>
  </head>
  <body>
    <div id="app">
      <!-- Main content (blurs when the settings overlay is open) -->
      <div class="main-content" id="main-content">
        <!-- Custom titlebar: macOS traffic lights · drag handle · search · settings -->
        <header class="titlebar">
          <div class="traffic">
            <button class="dot dot-close" id="win-close" data-sym="✕" title="Hide" aria-label="Hide"></button>
            <button class="dot dot-min" id="win-min" data-sym="−" title="Minimize" aria-label="Minimize"></button>
            <button class="dot dot-max" id="win-max" data-sym="⤢" title="Maximize" aria-label="Maximize"></button>
          </div>
          <div class="drag-handle" title="Drag window" aria-hidden="true">
            <svg viewBox="0 0 16 20" fill="currentColor"><circle cx="5" cy="5" r="2"/><circle cx="11" cy="5" r="2"/><circle cx="5" cy="10" r="2"/><circle cx="11" cy="10" r="2"/><circle cx="5" cy="15" r="2"/><circle cx="11" cy="15" r="2"/></svg>
          </div>
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="Search clipboard history…" />
          </div>
          <button class="iconbtn vault-open-btn" id="open-vault" title="Private Vault" aria-label="Private Vault">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="10" rx="2"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
          </button>
          <button class="iconbtn settings-btn" id="open-settings" title="Settings (Ctrl+,)" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </header>

        <!-- Filter chips -->
        <nav class="chips" id="chips" aria-label="Filter">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="text">Text</button>
          <button class="chip" data-filter="images">Images</button>
          <button class="chip" data-filter="pinned">Pinned</button>
        </nav>

        <main id="list" class="list" tabindex="-1"></main>

        <footer class="statusbar">
          <span id="status-count">0 items</span>
          <span class="status-hint">↑↓ navigate · Enter paste · / search · Esc close</span>
        </footer>

        <!-- Tiny credit line: developer portfolio + GitHub star CTA -->
        <div class="credit-bar" role="contentinfo">
          <span class="credit-text">
            Crafted by
            <button type="button" class="credit-link" id="credit-author" data-url="https://portfolio.syedamirali.me/" data-label="Portfolio" title="Open developer portfolio">
              Syed Amir Ali
            </button>
          </span>
          <span class="credit-sep" aria-hidden="true">·</span>
          <button type="button" class="credit-link credit-star" id="credit-star" data-url="https://github.com/SyedAmirAli/clipboard-history" data-label="GitHub repo" title="Star this project on GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7L12 17.8 5.7 21.2l1.7-7L2 9.5l7.1-.6L12 2z"/>
            </svg>
            <span>Star on GitHub</span>
          </button>
        </div>
      </div>

      <!-- Settings overlay (scrim dims + content blurs behind it) -->
      <div class="settings-scrim" id="settings-scrim"></div>
      <div id="settings-modal" class="settings-overlay" role="dialog" aria-modal="true" aria-hidden="true"></div>
      <div id="vault-modal" class="settings-overlay vault-overlay" role="dialog" aria-modal="true" aria-hidden="true"></div>

      <!-- Toast -->
      <div id="toast" class="toast hidden" role="status"></div>
    </div>

    <!-- Context menu lives outside #app so the settings blur never touches it -->
    <div id="ctx-menu" class="ctx-menu hidden" role="menu"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
