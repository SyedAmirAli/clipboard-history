# nfpm config — builds the .deb for clipd.
# Run after a successful `wails build -tags webkit2_41 -clean`.
#
#   nfpm pkg --packager deb --config nfpm.yaml --target dist/
#
# Produces dist/clipd_<version>_<arch>.deb

name: clipd
arch: amd64
platform: linux
version: "1.0.1"
section: utils
priority: optional
maintainer: "Syed Amir Ali <sywmohammadamir@gmail.com>"
description: |
  Lightweight clipboard history manager for Linux (X11 and Wayland).
  Captures text and image clipboard contents, supports pinning, search,
  a global hotkey (default Super+V), system tray, and a configurable
  max history size. Includes an encrypted Private Vault for sensitive
  items. Inspired by Windows' Win+V panel.
vendor: "clipd"
homepage: "https://github.com/SyedAmirAli/clipboard-history"
license: "MIT"

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37
  - libayatana-appindicator3-1
  - libx11-6
  # X11 backend (xclip/xdotool) and Wayland backend (wl-clipboard) are both
  # pulled in: clipd is a single binary that picks the right one at runtime
  # depending on the session, so both must be available.
  - xclip
  - xdotool
  - wl-clipboard

recommends:
  - libnotify-bin

contents:
  - src: ./build/bin/clipd
    dst: /usr/bin/clipd
    file_info:
      mode: 0755

  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/clipd.png
    file_info:
      mode: 0644

  - src: ./build/linux/clipd.desktop
    dst: /usr/share/applications/clipd.desktop
    file_info:
      mode: 0644

  # System-wide autostart: launches clipd on login for every user. The
  # in-app autostart toggle layers a per-user override on top of this.
  - src: ./build/linux/clipd-autostart.desktop
    dst: /etc/xdg/autostart/clipd.desktop
    file_info:
      mode: 0644
